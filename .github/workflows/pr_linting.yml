name: 📇 Code Linting

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number}}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chartboost/ruff-action@v1
      - name: Legacy naming check
        # The addon must not refer to the OpenPype/Avalon naming.
        run: |
          if grep -rInEi "openpype|avalon|\bpype\b" client/ \
              --include="*.py" --include="*.md" --include="*.txt"; then
            echo "::error::Found OpenPype/Avalon naming, see issue #14."
            exit 1
          fi
          echo "No OpenPype/Avalon naming found."
